<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phone preview</title>
<style>
  body { margin:0; background:#e8eaee; display:flex; align-items:flex-start; justify-content:center;
    padding:30px; font:13px -apple-system,sans-serif; }
  .wrap { text-align:center; }
  .label { margin-bottom:10px; color:#555; font-size:13px; }
  .label b { color:#111; }
  .frame { width:384px; height:854px; border:10px solid #1b1e24; border-radius:36px;
    box-shadow:0 10px 40px rgba(0,0,0,.25); overflow:hidden; background:#000; position:relative; }
  .notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:18px;
    background:#1b1e24; border-radius:0 0 12px 12px; z-index:2; }
  iframe { width:384px; height:854px; border:0; display:block; }
  .reload { margin-top:14px; padding:8px 16px; font:inherit; font-weight:600; cursor:pointer;
    border:1px solid #ccc; border-radius:8px; background:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">Phone view — <b>384 × 854</b> CSS px (your device: 720×1600px physical @ 300dpi)</div>
  <div class="frame">
    <div class="notch"></div>
    <iframe id="f" src="../index.html"></iframe>
  </div>
  <button class="reload" onclick="document.getElementById('f').src=document.getElementById('f').src">↻ Reload app</button>
</div>
</body>
</html>
