name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/patch-android.js

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name APK by build label
        id: ver
        run: |
          V=$(grep -oE 'build v[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z]' www/index.html | head -1 | sed 's/build v//')
          [ -z "$V" ] && V="dev"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/app-${V}.apk"
          echo "name=app-${V}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RF-Survey-Sheet-apk
          path: out/app-*.apk
